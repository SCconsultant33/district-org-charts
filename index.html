<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakland County District Counselor Directory</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --border: #d1d5db;
      --surface: #f9fafb;
      --focus: #0b5fff;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    .controls {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      max-width: 420px;
    }

    label { font-weight: 700; }

    select {
      width: 100%;
      padding: 0.7rem;
      border: 2px solid var(--border);
      border-radius: 0.5rem;
      font: inherit;
      color: var(--text);
      background-color: #fff;
    }

    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .district-meta {
      margin-top: 1rem;
      color: var(--muted);
      font-weight: 700;
    }

    .schools {
      margin-top: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 0.75rem;
    }

    .school {
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      overflow: clip;
      background: var(--surface);
    }

    .accordion-trigger {
      width: 100%;
      text-align: left;
      border: 0;
      background: #e5f3f1;
      color: var(--text);
      padding: 0.85rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .accordion-trigger:hover {
      background: #d9ecea;
    }

    .accordion-panel {
      padding: 0.75rem 0.85rem 0.9rem;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .accordion-panel[hidden] {
      display: none;
    }

    .counselors {
      margin: 0;
      padding-left: 1.1rem;
    }

    .empty {
      margin-top: 1rem;
      color: var(--muted);
      font-style: italic;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      background: #111827;
      color: #fff;
      padding: 0.6rem 0.9rem;
      border-radius: 0.35rem;
      text-decoration: none;
      z-index: 1000;
    }

    .skip-link:focus-visible {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="container">
    <header>
      <h1>Oakland County District Counselor Directory</h1>
      <p>Select a district to view schools and counseling staff.</p>
    </header>

    <section aria-labelledby="directory-controls">
      <h2 id="directory-controls" style="font-size:1.1rem; margin-bottom:0.4rem;">Directory controls</h2>
      <div class="controls">
        <label for="district-select">District</label>
        <select id="district-select" aria-describedby="district-help">
          <option value="">Choose a district</option>
        </select>
        <p id="district-help" style="margin:0; color:#4b5563;">After you select a district, expand each school to view counselor names.</p>
      </div>
    </section>

    <p class="district-meta" id="district-updated" aria-live="polite"></p>
    <section id="schools-region" aria-live="polite" aria-labelledby="schools-heading">
      <h2 id="schools-heading" style="font-size:1.1rem; margin-top:1.1rem;">Schools</h2>
      <div id="schools" class="schools"></div>
      <p class="empty" id="empty-message">No district selected.</p>
    </section>
  </main>

  <script>
    const districtSelect = document.getElementById('district-select');
    const schoolsContainer = document.getElementById('schools');
    const updatedEl = document.getElementById('district-updated');
    const emptyEl = document.getElementById('empty-message');

    const normalize = (name) => (name || '').trim();

    const byLastName = (a, b) => {
      const [aLast = '', aFirst = ''] = normalize(a).split(',').map((part) => part.trim());
      const [bLast = '', bFirst = ''] = normalize(b).split(',').map((part) => part.trim());
      return aLast.localeCompare(bLast, undefined, { sensitivity: 'base' }) ||
             aFirst.localeCompare(bFirst, undefined, { sensitivity: 'base' });
    };

    function renderDistrict(district) {
      schoolsContainer.innerHTML = '';

      if (!district) {
        updatedEl.textContent = '';
        emptyEl.hidden = false;
        emptyEl.textContent = 'No district selected.';
        return;
      }

      updatedEl.textContent = `Last updated: ${district.lastUpdated}`;
      emptyEl.hidden = true;

      district.schools.forEach((school, idx) => {
        const schoolId = `school-panel-${idx}`;
        const wrapper = document.createElement('article');
        wrapper.className = 'school';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'accordion-trigger';
        button.setAttribute('aria-expanded', 'false');
        button.setAttribute('aria-controls', schoolId);
        button.innerHTML = `<span>${school.name}</span><span aria-hidden="true">+</span>`;

        const panel = document.createElement('div');
        panel.className = 'accordion-panel';
        panel.id = schoolId;
        panel.hidden = true;

        const list = document.createElement('ul');
        list.className = 'counselors';

        [...school.counselors].sort(byLastName).forEach((name) => {
          const li = document.createElement('li');
          li.textContent = name;
          list.appendChild(li);
        });

        panel.appendChild(list);

        button.addEventListener('click', () => {
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          button.lastElementChild.textContent = expanded ? '+' : '−';
          panel.hidden = expanded;
        });

        wrapper.append(button, panel);
        schoolsContainer.appendChild(wrapper);
      });
    }

    async function init() {
      const response = await fetch('districts.json');
      const data = await response.json();
      const districts = data.districts.sort((a, b) => a.name.localeCompare(b.name));

      districts.forEach((district) => {
        const option = document.createElement('option');
        option.value = district.id;
        option.textContent = district.name;
        districtSelect.appendChild(option);
      });

      districtSelect.addEventListener('change', () => {
        const selected = districts.find((d) => d.id === districtSelect.value);
        renderDistrict(selected);
      });
    }

    init().catch((error) => {
      emptyEl.hidden = false;
      emptyEl.textContent = `Unable to load district directory data. ${error.message}`;
    });
  </script>
</body>
</html>
